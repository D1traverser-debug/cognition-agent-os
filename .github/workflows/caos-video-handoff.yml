name: CAOS Video governed handoff cross-repository acceptance

on:
  pull_request:
    paths:
      - 'src/cognition_agent_os/child_handoff.py'
      - 'scripts/verify_caos_video_handoff.py'
      - 'tests/test_child_video_handoff.py'
      - '.github/workflows/caos-video-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CAOS candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: caos
          persist-credentials: false
      - name: Checkout pinned Video Studio candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: D1traverser-debug/video-growth-agent
          ref: 2e482dcdfbf3e36375eeea587666d4e5997d8c32
          path: video
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Run real dual-engine admission tests
        env:
          PYTHONPATH: ${{ github.workspace }}/caos/src:${{ github.workspace }}/video
        run: python caos/scripts/verify_caos_video_handoff.py
