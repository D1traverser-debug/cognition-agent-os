[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognition-agent-os"
version = "0.0.1"
description = "P0/P1 bounded durable evidence workflow prototype"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cognition-os = "cognition_agent_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]