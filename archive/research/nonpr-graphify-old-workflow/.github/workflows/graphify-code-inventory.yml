name: Official Graphify code inventory
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p35-research-observation-integration-20261022
    paths:
      - .github/workflows/graphify-code-inventory.yml
permissions:
  contents: read
jobs:
  graphify-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Graphify package
        run: python -m pip install graphifyy
      - name: Show version and execute official code-only extraction
        env:
          GRAPHIFY_BACKEND: none
          GRAPHIFY_QUERY_LOG_DISABLE: '1'
        run: |
          graphify --version
          graphify extract . --code-only --no-viz
          test -f graphify-out/graph.json
          test -f graphify-out/GRAPH_REPORT.md
      - name: Upload real graph artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphify-official-code-inventory
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: warn
