  graphify_official_code_inventory:
    # Official third-party CLI on a clean temporary Linux runner.
    # Code-only AST extraction: no model API keys or production mutation.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest exact checked-out source commit
        run: python scripts/verify_ci_checkout_source.py
      - name: Install official Graphify in isolated runner
        run: python -m pip install --disable-pip-version-check graphifyy==0.9.94
      - name: Extract code graph and prove real artifact exists
        shell: bash
        env:
          GRAPHIFY_QUERY_LOG_DISABLE: '1'
        run: |
          set -euo pipefail
          graphify --version
          graphify extract . --code-only
          graphify cluster-only .
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          python scripts/verify_graphify_control_paths.py graphify-out/graph.json --output graphify-out/control_evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path("graphify-out/graph.json").read_text(encoding="utf-8"))
          assert isinstance(graph,dict) and graph, "Empty graph artifact"
          print("Official Graphify JSON top-level fields:",sorted(graph)[:15])
          print("Graph bytes:",Path("graphify-out/graph.json").stat().st_size)
          PY
      - name: Retain actual graph and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphify-official-code-inventory
          path: |
            graphify-out/graph.json
            graphify-out/control_evidence.json
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.html
          if-no-files-found: warn

  chatgpt_plugin_release_bundle:
    # A reviewable skills-only overlay for the EXISTING private ChatGPT plugin.
    # No installation or owner account mutation occurs in CI.
    if: ${{ github.event.repository.private == false && github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[bundle-chatgpt-plugin]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest exact checked-out source commit
        run: python scripts/verify_ci_checkout_source.py
      - name: Build exact native ChatGPT skill overlay from current HEAD
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import zipfile
          base = Path('integrations/chatgpt/cognition-agent-os-chatgpt')
          paths = [
              '.codex-plugin/plugin.json', 'plugin.json',
              'agents/openai.yaml',
              'skills/cognition-parent-chatgpt-intake/SKILL.md',
              'skills/cognition-parent-chatgpt-intake/references/scope-probes.md',
          ]
          manifest = json.loads((base/'plugin.json').read_text(encoding='utf-8'))
          native = json.loads((base/'.codex-plugin/plugin.json').read_text(encoding='utf-8'))
          assert manifest['name'] == native['name'] == 'cognition-agent-os-chatgpt'
          assert isinstance(manifest['version'], str) and __import__('re').fullmatch(r'\d+\.\d+\.\d+',manifest['version'])
          assert manifest['version'] == native['version']
          assert native['skills'] in ('./skills', './skills/')
          for rel in paths:
              source = base / rel
              assert source.is_file() and not source.is_symlink()
          with zipfile.ZipFile('cognition-chatgpt-plugin-overlay.zip','w',
                               compression=zipfile.ZIP_DEFLATED) as archive:
              for rel in paths:
                  archive.write(base / rel, arcname=rel)
          with zipfile.ZipFile('cognition-chatgpt-plugin-overlay.zip') as archive:
              assert sorted(archive.namelist()) == sorted(paths)
              for rel in paths:
                  assert archive.read(rel) == (base/rel).read_bytes()
          print('CURRENT_HEAD_CHATGPT_OVERLAY_BUILT', manifest['version'])
          PY
      - name: Preserve verifiable skill package without private account secrets
        uses: actions/upload-artifact@v4
        with:
          name: cognition-chatgpt-plugin-overlay-head
          path: cognition-chatgpt-plugin-overlay.zip
          if-no-files-found: error

  experimental_real_native_cognition:
    # Opt-in real Ollama inference on an ephemeral public CI runner.
    # Synthetic independent owner-acceptance labels and actual Host artifacts.
    # No paid inference, model API keys, user data, production grant or deployment.
    if: ${{ github.event.repository.private == false && github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[run-real-native-schema]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: 'qwen2.5-coder:0.5b'
            label: coder-05b
          - model: 'qwen2.5:1.5b'
            label: instruct-15b
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest exact checked-out source commit
        run: python scripts/verify_ci_checkout_source.py
      - name: Install Ollama on disposable public CI runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 https://ollama.com/install.sh --output "$RUNNER_TEMP/native-ollama-install.sh"
          sh "$RUNNER_TEMP/native-ollama-install.sh"
          ollama --version
      - name: Start loopback-only open model; prevent cloud provider use
        shell: bash
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NO_CLOUD: '1'
        run: |
          set -euo pipefail
          (ollama serve > "$RUNNER_TEMP/native-ollama.log" 2>&1 &)
          ready=0
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          timeout 420 ollama pull "${{ matrix.model }}"
      - name: Actual model -> native goal -> Worker -> independent owner oracle A/B
        shell: bash
        env:
          PYTHONPATH: src
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NO_CLOUD: '1'
          COGNITION_EVAL_MODEL: ${{ matrix.model }}
          COGNITION_EVAL_STRUCTURED: '1'
          COGNITION_EVAL_OUTPUT: real-native-cognition-evidence.json
        run: |
          set -euo pipefail
          timeout 900 python scripts/measure_real_native_goal.py
      - name: Preserve complete real model responses and independently graded failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-native-cognition-schema-${{ matrix.label }}
          path: real-native-cognition-evidence.json
          if-no-files-found: warn

