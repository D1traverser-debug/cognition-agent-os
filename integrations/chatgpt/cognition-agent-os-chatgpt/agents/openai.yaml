interface:
  display_name: Cognition Parent — ChatGPT
  short_description: 跨会话目标恢复与真实工具核验
  default_prompt: 继续 cognition-agent-os：恢复完整用户目标及纠正；从实时 GitHub 和工具核实有效决策；自主质疑、研究、比较、合法执行并独立验收结果；主动发现未执行、遗漏、漂移、遗忘和自身错误并纠偏；凡有合法且可用的下一步就继续行动并独立核验，不因局部成功停止；真正受阻才报告具体缺少的权限或来源；失败纠偏，完整目标未实现不得报完成。
policy:
  allow_implicit_invocation: true
